name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Run backend tests
        run: npm test

      - name: Install dependencies (gui)
        run: npm ci
        working-directory: gui

      - name: Run GUI tests
        run: npm test
        working-directory: gui
